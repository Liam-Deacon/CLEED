name: CMake

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  BUILD_TYPE: Release
  VCPKG_REF: '2025.12.12'

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Source compliance guard
      run: python tools/check_nr_free.py

    - name: Install build dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libtiff-dev

    - name: Install build dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install libtiff

    - name: Cache vcpkg (Windows)
      if: runner.os == 'Windows'
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg
        # Cache key depends on vcpkg inputs (manifest/config) instead of the workflow file
        key: ${{ runner.os }}-vcpkg-tiff-${{ hashFiles('vcpkg*.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-tiff-

    - name: Install build dependencies (Windows via vcpkg)
      if: runner.os == 'Windows' && steps.cache-vcpkg.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $vcpkgRoot = "$env:GITHUB_WORKSPACE/vcpkg"
        if (-not (Test-Path $vcpkgRoot)) {
          git clone --depth 1 --branch ${{ env.VCPKG_REF }} https://github.com/microsoft/vcpkg $vcpkgRoot
        }
        & "$vcpkgRoot/bootstrap-vcpkg.bat"
        & "$vcpkgRoot/vcpkg.exe" install --triplet x64-windows

    - name: Configure CMake (Linux/macOS)
      if: runner.os != 'Windows'
      run: >
        cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -DWITH_QT=OFF
        -DWITH_OPENCL=OFF
        -DWITH_PHASESHIFTS=OFF
        -DINSTALL_DOC=OFF
        -DBUILD_TESTING=ON

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: >
        cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build
        -A x64
        -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        -DVCPKG_TARGET_TRIPLET=x64-windows
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -DWITH_QT=OFF
        -DWITH_OPENCL=OFF
        -DWITH_PHASESHIFTS=OFF
        -DINSTALL_DOC=OFF
        -DBUILD_TESTING=ON

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure
