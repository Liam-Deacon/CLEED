name: Docs (Sphinx)

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r doc/requirements.txt

      - name: Build docs
        run: |
          make -C doc html SPHINXOPTS="--keep-going -n -W"
          touch doc/_build/html/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if GitHub Pages is enabled with workflow build type
          PAGES_INFO=$(gh api repos/${{ github.repository }}/pages 2>&1) || {
            echo "::error::GitHub Pages is not enabled for this repository."
            echo "::error::To fix: Go to Settings > Pages > Source and select 'GitHub Actions'"
            echo "::error::Or run: gh api repos/${{ github.repository }}/pages -X POST -f build_type='workflow'"
            exit 1
          }
          BUILD_TYPE=$(echo "$PAGES_INFO" | jq -r '.build_type // empty')
          if [ "$BUILD_TYPE" != "workflow" ]; then
            echo "::error::GitHub Pages build type is '$BUILD_TYPE', expected 'workflow'."
            echo "::error::To fix: Go to Settings > Pages > Source and select 'GitHub Actions'"
            exit 1
          fi
          echo "✓ GitHub Pages is enabled with workflow build type"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
