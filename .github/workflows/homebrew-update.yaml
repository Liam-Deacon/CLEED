name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to update formula for (e.g., v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Get release info
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_TAG:-}" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          
          version="${tag#v}"
          
          # Get source tarball URL and calculate SHA256
          tarball_url="https://github.com/${REPO}/archive/refs/tags/${tag}.tar.gz"
          sha256=$(curl -sL "${tarball_url}" | sha256sum | cut -d' ' -f1)
          
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "tarball_url=${tarball_url}" >> "$GITHUB_OUTPUT"

      - name: Generate formula
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          set -euo pipefail

          # Read template and substitute placeholders
          sed -e "s/__VERSION__/${VERSION}/g" \
              -e "s/__SHA256__/${SHA256}/g" \
              packaging/homebrew/cleed.rb.template > cleed.rb
          
          cat cleed.rb

      - name: Push to tap repository
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          TAP_REPO_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          # This requires a PAT with write access to the tap repository
          # Store it as TAP_REPO_TOKEN in repository secrets
          
          if [[ -z "${TAP_REPO_TOKEN:-}" ]]; then
            echo "::warning::TAP_REPO_TOKEN not set - skipping tap update"
            echo "To enable automatic tap updates:"
            echo "1. Create a PAT with repo scope"
            echo "2. Add it as TAP_REPO_TOKEN secret"
            echo "3. Create https://github.com/Liam-Deacon/homebrew-tap"
            exit 0
          fi
          
          # Clone tap repository
          git clone "https://${TAP_REPO_TOKEN}@github.com/Liam-Deacon/homebrew-tap.git" tap-repo
          
          # Copy formula
          cp cleed.rb tap-repo/Formula/cleed.rb
          
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet; then
            echo "No changes to formula"
          else
            git add Formula/cleed.rb
            git commit -m "Update cleed to ${VERSION}"
            git push
            echo "Formula updated successfully"
          fi
